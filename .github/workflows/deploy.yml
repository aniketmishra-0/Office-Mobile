name: Auto Deploy to GCP & Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to GCP
        env:
          GCP_SA_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Encode secret to base64 to preserve special chars and newlines
          ENCODED_JSON=$(echo "$GCP_SA_JSON_B64" | base64 -w 0)
          gcloud compute ssh archana_tiwari@office-mobile-server \
            --zone=us-east1-c \
            --quiet \
            --command='set -e; REPO="$HOME/Office-Mobile"; if [ ! -d "$REPO/.git" ]; then git clone https://github.com/aniketmishra-0/Office-Mobile.git "$REPO"; fi; cd "$REPO"; git fetch origin main; git checkout main; git pull --ff-only origin main; GOOGLE_SERVICE_ACCOUNT_JSON_B64='"$ENCODED_JSON"' bash ./scripts/deploy-backend.sh'

      - name: Trigger Frontend Vercel Deployment
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "Triggering Vercel deployment..."
            curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
          else
            echo "Vercel auto-deploys via GitHub. If you want to trigger it from here, add VERCEL_DEPLOY_HOOK in GitHub Secrets."
          fi
