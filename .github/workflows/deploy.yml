name: Auto Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCP via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd ~/Office-Mobile
            git pull origin main
            
            # ---- Frontend: Rebuild & Restart ----
            cd frontend
            npm install --production=false
            npm run build
            pm2 restart all || true
            cd ..
            
            # ---- Backend: Kill old & Start new ----
            sudo pkill -f uvicorn || true
            sleep 2
            cd backend
            sudo nohup /usr/local/bin/python3.12 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
