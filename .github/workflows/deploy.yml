name: Auto Deploy to GCP & Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend to GCP via SSH
        uses: appleboy/ssh-action@master
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: GOOGLE_SERVICE_ACCOUNT_JSON
          command_timeout: 25m
          script: |
            cd ~/Office-Mobile
            bash scripts/deploy-backend.sh

      - name: Trigger Frontend Vercel Deployment
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "Triggering Vercel deployment..."
            curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
          else
            echo "Vercel auto-deploys via GitHub. If you want to trigger it from here, add VERCEL_DEPLOY_HOOK in GitHub Secrets."
          fi
