<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Office Mobile — Offline</title>
    <meta name="theme-color" content="#F7F3EE" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <style>
      :root {
        --cream: #f7f3ee;
        --ink: #1b1b1b;
        --stone: #7a736b;
        --rule: #d9cfc2;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: Georgia, "Times New Roman", serif;
        background: var(--cream);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border: 1px solid var(--ink);
        padding: 28px 24px;
        text-align: center;
      }
      .kicker {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Courier New", monospace;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--stone);
        margin: 0 0 10px;
      }
      h1 {
        font-weight: 400;
        font-size: 22px;
        line-height: 1.3;
        margin: 0 0 12px;
      }
      p {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Courier New", monospace;
        font-size: 12px;
        line-height: 1.55;
        color: var(--stone);
        margin: 0 0 20px;
      }
      button {
        display: inline-block;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--cream);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Courier New", monospace;
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 12px 20px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <p class="kicker">offline</p>
      <h1>You&rsquo;re not connected.</h1>
      <p>
        Office Mobile works offline once you open a form you&rsquo;ve visited
        before. Reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
    <script>
      // Auto-reload as soon as the browser reports we're back online.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
